name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      app_url:
        description: "Web app URL the APK opens"
        required: false
        default: "https://lumino.infinitymade.de"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PappUrl="${{ inputs.app_url || 'https://lumino.infinitymade.de' }}"
          cp app/build/outputs/apk/release/app-release.apk LuminoFit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LuminoFit-apk
          path: android/LuminoFit.apk

      - name: Publish "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest LuminoFit.apk \
            --target "${{ github.sha }}" \
            --title "Lumino Fit APK (build ${{ github.run_number }})" \
            --notes "Telefonda bu sayfayı aç, LuminoFit.apk dosyasını indir ve kur. Branch: ${{ github.ref_name }}, commit: ${{ github.sha }}" \
            --prerelease
